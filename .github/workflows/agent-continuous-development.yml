name: Children of Eltan Mod Health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Validate canonical mod state
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/MOD_ARCHITECTURE.md
          test -s docs/MODDING_CAPABILITY_MATRIX.md
          test -s docs/ROADMAP.md
          test -s docs/AGENT_DEVELOPMENT_LOOP.md
          test -s mod/README.md
          test -s mod/project.json
          test -s .github/project-mode.json
          test -s .github/release-decision.json
          python3 -m json.tool mod/project.json >/dev/null
          python3 -m json.tool .github/project-mode.json >/dev/null
          python3 -m json.tool .github/release-decision.json >/dev/null

      - name: Enforce mod-first project mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          mode = json.load(open('.github/project-mode.json', encoding='utf-8'))
          release = json.load(open('.github/release-decision.json', encoding='utf-8'))
          assert mode['project_name'] == 'Дети Эльтана'
          assert mode['project_type'] == 'space-rangers-2-mod'
          assert mode['canonical_branch'] == 'master'
          assert mode['canonical_mod_root'] == 'mod/'
          assert mode['legacy_prototype_status'] == 'reference-only'
          assert mode['standalone_webgl_release'] is False
          assert mode['android_apk_release'] is False
          assert release['release'] is False
          PY

      - name: Check repository stayed clean
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)" || {
            echo 'Health check modified tracked files; refusing silent drift.' >&2
            exit 1
          }
